services:
  adg-api-services:
    build: .
    ports:
      - "3010:3010"
      - "9230:9230"
    environment:
      NODE_ENV: development
      DB_HOST: adg-db-postgres-services
      DB_PORT: 5432
      DB_USER: adg-user-postgres
      DB_PASSWORD: postgres
      DB_NAME: adg-db-postgres
      JWT_SECRET: local-super-secret-key
      CORS_ORIGIN: http://localhost:4200
      PLATFORM_ONBOARDING_KEY: local-onboarding-key
      PORT: 3010
    command: npm run dev:debug
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - adg-db-postgres-services

  adg-db-postgres-services:
    image: postgres:15
    environment:
      POSTGRES_DB: adg-db-postgres
      POSTGRES_USER: adg-user-postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
